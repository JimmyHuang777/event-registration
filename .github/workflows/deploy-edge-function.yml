name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/registrant-api/**'
      - 'supabase/functions/tasks-api/**'
      - 'supabase/functions/tasks-admin-api/**'
      - 'supabase/functions/create-liff-app/**'
      - 'supabase/functions/flow-api/**'
      - 'supabase/functions/flow-admin-api/**'
      - 'supabase/functions/home-api/**'
      - 'supabase/functions/events-admin-api/**'
      - 'supabase/functions/carpool-api/**'
      - 'supabase/functions/lodging-api/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # --no-verify-jwt is required on every deploy: these functions do
      # their own auth (verifying the LINE ID token / Supabase session
      # token inside the function body), so Supabase's own gateway-level
      # JWT check must stay off. Without this flag a fresh/redeployed
      # function can silently revert to gateway-enforced JWT, which
      # rejects every request with a 401 before our code even runs.
      - name: Deploy registrant-api Edge Function
        run: supabase functions deploy registrant-api --project-ref ixzvbyxhzttvnheivsoc --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy tasks-api Edge Function
        run: supabase functions deploy tasks-api --project-ref ixzvbyxhzttvnheivsoc --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy tasks-admin-api Edge Function
        run: supabase functions deploy tasks-admin-api --project-ref ixzvbyxhzttvnheivsoc --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy create-liff-app Edge Function
        run: supabase functions deploy create-liff-app --project-ref ixzvbyxhzttvnheivsoc --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy flow-api Edge Function
        run: supabase functions deploy flow-api --project-ref ixzvbyxhzttvnheivsoc --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy flow-admin-api Edge Function
        run: supabase functions deploy flow-admin-api --project-ref ixzvbyxhzttvnheivsoc --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy home-api Edge Function
        run: supabase functions deploy home-api --project-ref ixzvbyxhzttvnheivsoc --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy events-admin-api Edge Function
        run: supabase functions deploy events-admin-api --project-ref ixzvbyxhzttvnheivsoc --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy carpool-api Edge Function
        run: supabase functions deploy carpool-api --project-ref ixzvbyxhzttvnheivsoc --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy lodging-api Edge Function
        run: supabase functions deploy lodging-api --project-ref ixzvbyxhzttvnheivsoc --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
