name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/registrant-api/**'
      - 'supabase/functions/tasks-api/**'
      - 'supabase/functions/create-liff-app/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy registrant-api Edge Function
        run: supabase functions deploy registrant-api --project-ref ixzvbyxhzttvnheivsoc
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy tasks-api Edge Function
        run: supabase functions deploy tasks-api --project-ref ixzvbyxhzttvnheivsoc
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy create-liff-app Edge Function
        run: supabase functions deploy create-liff-app --project-ref ixzvbyxhzttvnheivsoc
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
