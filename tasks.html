<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>任務認領 Task Roster</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root {
    --line-green: #06C755;
    --line-green-dark: #05A648;
    --ink: #1A1A1A;
    --ink-soft: #6B6F76;
    --paper: #FFFFFF;
    --field-bg: #F3F4F6;
    --error: #E0453C;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: #EDEEF1;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang TC", "Noto Sans TC", sans-serif;
    color: var(--ink);
  }
  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--paper); display: flex; flex-direction: column; }
  .header { background: var(--line-green); color: white; padding: 24px 20px 20px; }
  .header h1 { margin: 0; font-size: 19px; font-weight: 700; }
  .header p { margin: 6px 0 0; font-size: 13px; opacity: 0.92; }

  .profile-row { display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--field-bg); }
  .profile-row img { width: 32px; height: 32px; border-radius: 50%; background: var(--field-bg); object-fit: cover; }
  .profile-row .name { font-size: 13.5px; font-weight: 600; }

  .tabs { display: flex; flex-wrap: wrap; gap: 6px; padding: 14px 20px 0; }
  .tab-btn {
    flex: 1 1 30%; padding: 9px 4px; border-radius: 20px; border: 1.5px solid var(--field-bg);
    background: var(--field-bg); color: var(--ink-soft); font-size: 12.5px; font-weight: 600;
    font-family: inherit; cursor: pointer; text-align: center; white-space: nowrap;
  }
  .tab-btn.active { background: #E4F8EC; border-color: var(--line-green); color: var(--line-green-dark); }

  .mine-toggle { display: flex; align-items: center; gap: 8px; padding: 12px 20px 4px; font-size: 13px; color: var(--ink-soft); }
  .mine-toggle input { width: 16px; height: 16px; }

  .task-list { padding: 12px 20px 24px; flex: 1; }
  .date-heading { font-size: 12.5px; font-weight: 700; color: var(--ink-soft); margin: 18px 0 8px; }
  .date-heading:first-child { margin-top: 0; }

  .task-card {
    border: 1.5px solid var(--field-bg); border-radius: 12px; padding: 14px; margin-bottom: 10px;
  }
  .task-card.mine { border-color: var(--line-green); background: #F3FCF6; }
  .task-title { font-size: 15px; font-weight: 700; margin-bottom: 3px; }
  .task-place { font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; display: flex; align-items: center; gap: 4px; }
  .task-desc { font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; margin-bottom: 8px; }
  .task-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .slots-label { font-size: 12.5px; color: var(--ink-soft); }
  .slots-label.full { color: var(--error); font-weight: 600; }
  .assignee-names { font-size: 12px; color: var(--ink-soft); margin-top: 6px; }

  .claim-btn, .release-btn {
    padding: 8px 16px; border-radius: 20px; border: none; font-size: 13px; font-weight: 700;
    cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  .claim-btn { background: var(--line-green); color: white; }
  .claim-btn:hover { background: var(--line-green-dark); }
  .claim-btn:disabled { background: #C7CAD1; cursor: not-allowed; }
  .release-btn { background: var(--field-bg); color: var(--error); }

  .subtask-list { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--field-bg); }
  .subtask-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 13px; }
  .subtask-row input[type="checkbox"] { width: 16px; height: 16px; flex-shrink: 0; }
  .subtask-row .subtask-title { flex: 1; }
  .subtask-row .subtask-title.done { text-decoration: line-through; color: var(--ink-soft); }
  .subtask-row .subtask-by { font-size: 11px; color: var(--ink-soft); white-space: nowrap; }
  .subtask-take-btn {
    background: var(--field-bg); color: var(--ink); border: none; border-radius: 12px;
    padding: 4px 10px; font-size: 11.5px; font-weight: 700; cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  .subtask-release-btn {
    background: none; border: none; color: var(--error); font-size: 11px; text-decoration: underline;
    cursor: pointer; padding: 0; white-space: nowrap;
  }
  .mark-complete-btn {
    padding: 8px 16px; border-radius: 20px; border: none; font-size: 13px; font-weight: 700;
    cursor: pointer; font-family: inherit; white-space: nowrap; background: var(--ink); color: white;
  }
  .status-badge { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 20px; white-space: nowrap; }
  .status-badge.completed { background: #FFF3D6; color: #92650A; }
  .status-badge.confirmed { background: #E4F8EC; color: var(--line-green-dark); }

  .empty-note { text-align: center; color: var(--ink-soft); font-size: 13.5px; padding: 40px 20px; }

  .state-screen {
    flex: 1; display: none; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; padding: 40px 24px;
  }
  .state-screen.active { display: flex; }
  .spinner {
    width: 32px; height: 32px; border: 3px solid var(--field-bg);
    border-top-color: var(--line-green); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .icon-circle {
    width: 56px; height: 56px; border-radius: 50%; color: white; font-size: 28px;
    display: flex; align-items: center; justify-content: center; margin-bottom: 16px; background: var(--error);
  }
  .state-screen h2 { font-size: 17px; margin: 0 0 6px; }
  .state-screen p { font-size: 13.5px; color: var(--ink-soft); margin: 0; max-width: 300px; line-height: 1.5; white-space: pre-wrap; }
  .submit-btn {
    padding: 12px 20px; background: var(--line-green); color: white; border: none;
    border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 18px;
  }

  .claim-modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    align-items: flex-end; justify-content: center; z-index: 100;
  }
  .claim-modal-overlay.show { display: flex; }
  .claim-modal { background: var(--paper); border-radius: 16px 16px 0 0; padding: 24px 20px; width: 100%; max-width: 480px; }
  .claim-modal h3 { margin: 0 0 4px; font-size: 16px; }
  .claim-modal p { margin: 0 0 16px; font-size: 13px; color: var(--ink-soft); }
  .claim-modal .field { margin-bottom: 12px; }
  .claim-modal .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
  .claim-modal .field input {
    width: 100%; padding: 11px 12px; border: 1.5px solid var(--field-bg); background: var(--field-bg);
    border-radius: 8px; font-size: 14.5px; font-family: inherit;
  }
  .claim-modal-actions { display: flex; gap: 10px; margin-top: 16px; }
  .claim-modal-actions button { flex: 1; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 700; border: none; font-family: inherit; cursor: pointer; }
  .claim-modal-actions .confirm-btn { background: var(--line-green); color: white; }
  .claim-modal-actions .cancel-btn { background: var(--field-bg); color: var(--ink); }

  #main-screen { display: none; flex-direction: column; flex: 1; }

  /* ---- Calendar view ---- */
  .calendar-wrap { padding: 14px 20px 0; display: none; }
  .calendar-wrap.active { display: block; }
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-nav button {
    width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--field-bg); background: var(--paper);
    font-size: 15px; cursor: pointer; color: var(--ink);
  }
  .cal-nav .cal-month-label { font-size: 14.5px; font-weight: 700; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal-dow { text-align: center; font-size: 11px; color: var(--ink-soft); padding: 4px 0; font-weight: 600; }
  .cal-day {
    aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 8px; font-size: 12.5px; cursor: pointer; position: relative; background: var(--field-bg);
    color: var(--ink); border: 1.5px solid transparent;
  }
  .cal-day.empty { background: none; cursor: default; }
  .cal-day.today { border-color: var(--line-green); }
  .cal-day.selected { background: var(--line-green); color: white; }
  .cal-day .cal-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--line-green-dark); margin-top: 2px; }
  .cal-day.selected .cal-dot { background: white; }
  .cal-day.mine-dot .cal-dot { background: var(--error); }
  .cal-day.selected.mine-dot .cal-dot { background: white; }
  .cal-selected-heading { font-size: 13px; font-weight: 700; color: var(--ink-soft); margin: 16px 0 8px; }
</style>
</head>
<body>

<div id="app">

  <div id="loading-screen" class="state-screen active">
    <div class="spinner"></div>
    <p>連接 LINE 中 · Connecting to LINE…</p>
  </div>

  <div id="error-screen" class="state-screen">
    <div class="icon-circle">!</div>
    <h2>連線失敗</h2>
    <p id="error-message">請透過 LINE 開啟此頁面。</p>
    <button type="button" class="submit-btn" id="relogin-btn">重新登入 Re-login</button>
  </div>

  <div id="main-screen">
    <div class="header">
      <h1>任務認領 Task Roster</h1>
      <p>瀏覽並認領每日／每週／每月的工作</p>
    </div>

    <div class="profile-row">
      <img id="profile-pic" src="" alt="">
      <span class="name" id="profile-name">—</span>
    </div>

    <div class="tabs">
      <button type="button" class="tab-btn active" data-recurrence="daily">每日 Daily</button>
      <button type="button" class="tab-btn" data-recurrence="weekly">每週 Weekly</button>
      <button type="button" class="tab-btn" data-recurrence="monthly">每月 Monthly</button>
      <button type="button" class="tab-btn" data-recurrence="once">單次 One-time</button>
      <button type="button" class="tab-btn" data-recurrence="calendar">月曆 Calendar</button>
    </div>

    <label class="mine-toggle" id="mine-toggle-row">
      <input type="checkbox" id="mine-only-checkbox">
      只顯示我已認領的 Show only my tasks
    </label>

    <div class="calendar-wrap" id="calendar-wrap">
      <div class="cal-nav">
        <button type="button" id="cal-prev-btn">‹</button>
        <span class="cal-month-label" id="cal-month-label"></span>
        <button type="button" id="cal-next-btn">›</button>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>

    <div class="task-list" id="task-list"></div>
  </div>

</div>

<div class="claim-modal-overlay" id="claim-modal-overlay">
  <div class="claim-modal">
    <h3>確認認領 Confirm claim</h3>
    <p id="claim-modal-task-title"></p>
    <div class="field">
      <label>姓名 Name</label>
      <input type="text" id="claim-name">
    </div>
    <div class="field">
      <label>手機號碼 Phone <span style="font-weight:400; color:var(--ink-soft);">用於聯繫</span></label>
      <input type="tel" id="claim-phone" placeholder="0912-345-678">
    </div>
    <div class="claim-modal-actions">
      <button type="button" class="cancel-btn" id="claim-modal-cancel">取消</button>
      <button type="button" class="confirm-btn" id="claim-modal-confirm">確認認領 Claim</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   CONFIG
   ========================================================= */
// LIFF_ID is looked up at load time from the liff_apps table (the
// dashboard's Task Management panel creates it automatically, the
// same way each event gets its own unique LIFF app) — no manual
// LINE Developers Console step needed.
let LIFF_ID = null;
const EDGE_FUNCTION_URL = 'https://ixzvbyxhzttvnheivsoc.functions.supabase.co/tasks-api';

// Used ONLY to read the public liff_apps row before login — same
// pattern as the registration form's public event lookup.
const SUPABASE_URL = 'https://ixzvbyxhzttvnheivsoc.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml4enZieXhoenR0dm5oZWl2c29jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMTUxNzEsImV4cCI6MjEwNDc5MTE3MX0.IbPkpX8fepK4o3yDXHOGH0UXt1n3-17YXdcv36LxJuU';
/* ========================================================= */

const supabasePublic = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const screens = {
  loading: document.getElementById('loading-screen'),
  error: document.getElementById('error-screen'),
  main: document.getElementById('main-screen'),
};
function showScreen(name) {
  Object.entries(screens).forEach(([key, el]) => {
    if (key === 'main') { el.style.display = key === name ? 'flex' : 'none'; }
    else { el.classList.toggle('active', key === name); }
  });
}

let idToken = null;
let lineProfile = null;
let allTasks = [];
let activeTab = 'daily';
let mineOnly = false;
let pendingClaimInstanceId = null;

// Calendar view state
let calendarCursor = new Date(); // day-of-month is irrelevant, only y/m used
let calendarTasks = [];
let calendarLoadedKey = null; // "YYYY-MM" already fetched, to avoid refetching
let selectedCalendarDate = null;

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function callApi(action, extra = {}) {
  const res = await fetch(EDGE_FUNCTION_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, idToken, ...extra }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || '發生錯誤 Something went wrong');
  return data;
}

function setLoadingText(text) {
  const p = document.querySelector('#loading-screen p');
  if (p) p.textContent = text;
}

function withTimeout(promise, ms, label) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error('TIMEOUT at: ' + label)), ms)),
  ]);
}

async function initLiff() {
  try {
    setLoadingText('讀取設定中…');
    const { data: liffRow, error: liffErr } = await withTimeout(
      supabasePublic.from('liff_apps').select('liff_id').eq('purpose', 'tasks').maybeSingle(),
      10000, 'liff_apps lookup'
    );
    if (liffErr || !liffRow || !liffRow.liff_id) {
      document.getElementById('error-message').textContent =
        '此頁面尚未設定 LINE 連結，請聯繫管理員在後台的「任務管理」中建立連結。';
      showScreen('error');
      return;
    }
    LIFF_ID = liffRow.liff_id;

    setLoadingText('liff.init()…');
    await withTimeout(liff.init({ liffId: LIFF_ID }), 10000, 'liff.init()');

    if (!liff.isLoggedIn()) {
      setLoadingText('導向 LINE 登入…');
      liff.login({ redirectUri: window.location.href });
      return;
    }

    idToken = liff.getIDToken();
    lineProfile = await withTimeout(liff.getProfile(), 10000, 'liff.getProfile()');

    if (!idToken) {
      document.getElementById('error-message').textContent =
        'LIFF app is missing the "openid" scope.\nAdd it in LINE Developers Console → LIFF → Scopes.';
      showScreen('error');
      return;
    }

    document.getElementById('profile-pic').src = lineProfile.pictureUrl || '';
    document.getElementById('profile-name').textContent = lineProfile.displayName;
    document.getElementById('claim-name').value = lineProfile.displayName;

    await loadTasks();
    showScreen('main');
  } catch (err) {
    console.error('LIFF init failed:', err);
    const msg = (err && err.message) ? err.message : '';
    if (/access token expired/i.test(msg)) {
      document.getElementById('error-message').textContent = '您的 LINE 登入已過期，請點擊下方按鈕重新登入。';
    } else {
      document.getElementById('error-message').textContent = '請透過 LINE 開啟此頁面。\n\n' + msg;
    }
    showScreen('error');
  }
}

document.getElementById('relogin-btn').addEventListener('click', () => {
  try { liff.logout(); } catch (e) {}
  window.location.reload();
});

async function loadTasks() {
  const { tasks } = await callApi('list_tasks', { days: 90 });
  allTasks = tasks || [];
  renderTasks();
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeTab = btn.dataset.recurrence;
    renderTasks();
  });
});

document.getElementById('mine-only-checkbox').addEventListener('change', (e) => {
  mineOnly = e.target.checked;
  renderTasks();
});

function formatDateHeading(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const weekday = ['週日','週一','週二','週三','週四','週五','週六'][d.getDay()];
  return d.toLocaleDateString('zh-TW', { month: 'long', day: 'numeric' }) + '（' + weekday + '）';
}

function subtaskListHTML(t) {
  if (!t.subtasks || t.subtasks.length === 0) return '';
  const canClaim = !!t.can_claim_subtasks;
  return `
    <div class="subtask-list">
      ${t.subtasks.map(s => {
        const iid = t.instance_id, sid = s.subtask_template_id;
        if (s.status === 'unassigned') {
          return `
            <div class="subtask-row">
              <span class="subtask-title">${escapeHtml(s.title)}</span>
              ${canClaim ? `<button type="button" class="subtask-take-btn" data-instance-id="${iid}" data-subtask-id="${sid}">認領 Take</button>` : `<span class="subtask-by">未認領</span>`}
            </div>`;
        }
        if (s.status === 'taken') {
          if (s.assigned_to_me) {
            return `
              <label class="subtask-row">
                <input type="checkbox" data-action="complete-subtask" data-instance-id="${iid}" data-subtask-id="${sid}">
                <span class="subtask-title">${escapeHtml(s.title)}</span>
                <button type="button" class="subtask-release-btn" data-action="release-subtask" data-instance-id="${iid}" data-subtask-id="${sid}">放棄</button>
              </label>`;
          }
          return `
            <div class="subtask-row">
              <span class="subtask-title">${escapeHtml(s.title)}</span>
              <span class="subtask-by">${escapeHtml(s.assigned_name || '—')} 認領中</span>
            </div>`;
        }
        // completed
        if (s.assigned_to_me) {
          return `
            <label class="subtask-row">
              <input type="checkbox" checked data-action="complete-subtask" data-instance-id="${iid}" data-subtask-id="${sid}">
              <span class="subtask-title done">${escapeHtml(s.title)}</span>
              <span class="subtask-by">已完成</span>
            </label>`;
        }
        return `
          <div class="subtask-row">
            <span class="subtask-title done">${escapeHtml(s.title)}</span>
            <span class="subtask-by">${escapeHtml(s.assigned_name || '—')} 已完成</span>
          </div>`;
      }).join('')}
    </div>`;
}

function taskCardHTML(t) {
  const isFull = t.slots_filled >= t.slots_total;
  const isMine = !!t.my_assignment_id;
  const names = t.assignees.map(a => escapeHtml(a.display_name || '—')).join('、');

  let actionHTML;
  if (t.my_assignment_status === 'completed') {
    actionHTML = `<span class="status-badge completed">已完成，待確認</span>`;
  } else if (t.my_assignment_status === 'confirmed') {
    actionHTML = `<span class="status-badge confirmed">✓ 已確認</span>`;
  } else if (isMine) {
    actionHTML = `
      <div style="display:flex; gap:8px; align-items:center;">
        <button type="button" class="mark-complete-btn" data-assignment-id="${t.my_assignment_id}">標記完成</button>
        <button type="button" class="release-btn" data-assignment-id="${t.my_assignment_id}">取消認領</button>
      </div>`;
  } else if (isFull) {
    actionHTML = `<button type="button" class="claim-btn" disabled>已額滿</button>`;
  } else {
    actionHTML = `<button type="button" class="claim-btn" data-instance-id="${t.instance_id}" data-title="${escapeHtml(t.title)}">認領 Claim</button>`;
  }

  return `
    <div class="task-card ${isMine ? 'mine' : ''}">
      <div class="task-title">${escapeHtml(t.title)}</div>
      ${t.place ? `<div class="task-place">📍 ${escapeHtml(t.place)}</div>` : ''}
      ${t.description ? `<div class="task-desc">${escapeHtml(t.description)}</div>` : ''}
      <div class="task-meta">
        <span class="slots-label ${isFull ? 'full' : ''}">${t.slots_filled} / ${t.slots_total} 人</span>
        ${actionHTML}
      </div>
      ${names ? `<div class="assignee-names">已認領：${names}</div>` : ''}
      ${subtaskListHTML(t)}
    </div>`;
}

function bindTaskListEvents(listEl) {
  listEl.querySelectorAll('.claim-btn:not(:disabled)').forEach(btn => {
    btn.addEventListener('click', () => openClaimModal(btn.dataset.instanceId, btn.dataset.title));
  });
  listEl.querySelectorAll('.release-btn').forEach(btn => {
    btn.addEventListener('click', () => releaseTask(btn.dataset.assignmentId));
  });
  listEl.querySelectorAll('.mark-complete-btn').forEach(btn => {
    btn.addEventListener('click', () => completeTask(btn.dataset.assignmentId));
  });
  listEl.querySelectorAll('.subtask-take-btn').forEach(btn => {
    btn.addEventListener('click', () => claimSubtask(btn.dataset.instanceId, btn.dataset.subtaskId));
  });
  listEl.querySelectorAll('[data-action="release-subtask"]').forEach(btn => {
    btn.addEventListener('click', () => releaseSubtask(btn.dataset.instanceId, btn.dataset.subtaskId));
  });
  listEl.querySelectorAll('[data-action="complete-subtask"]').forEach(cb => {
    cb.addEventListener('change', () => completeSubtask(cb.dataset.instanceId, cb.dataset.subtaskId, cb.checked));
  });
}

function renderTasks() {
  const listEl = document.getElementById('task-list');
  const calWrap = document.getElementById('calendar-wrap');
  const mineToggleRow = document.getElementById('mine-toggle-row');

  if (activeTab === 'calendar') {
    calWrap.classList.add('active');
    mineToggleRow.style.display = 'none';
    loadCalendarMonth();
    return;
  }
  calWrap.classList.remove('active');
  mineToggleRow.style.display = 'flex';

  let filtered = allTasks.filter(t => t.recurrence === activeTab);
  if (mineOnly) filtered = filtered.filter(t => !!t.my_assignment_id);

  if (filtered.length === 0) {
    listEl.innerHTML = `<div class="empty-note">目前沒有${mineOnly ? '已認領的' : ''}任務。</div>`;
    return;
  }

  const byDate = {};
  filtered.forEach(t => {
    if (!byDate[t.occurrence_date]) byDate[t.occurrence_date] = [];
    byDate[t.occurrence_date].push(t);
  });

  listEl.innerHTML = Object.keys(byDate).sort().map(date => `
    <div class="date-heading">${formatDateHeading(date)}</div>
    ${byDate[date].map(taskCardHTML).join('')}
  `).join('');

  bindTaskListEvents(listEl);
}

// Subtask/task status actions all just refetch the affected views —
// simpler and safer than hand-patching every derived field (status
// badges, "誰認領了" labels, slot counts) locally.
async function refreshAfterChange() {
  calendarLoadedKey = null;
  if (activeTab === 'calendar') {
    await loadCalendarMonth();
  } else {
    await loadTasks();
  }
}

async function claimSubtask(instanceId, subtaskTemplateId) {
  try {
    await callApi('claim_subtask', { instance_id: instanceId, subtask_template_id: subtaskTemplateId });
    await refreshAfterChange();
  } catch (err) {
    alert('認領失敗，請稍後再試。\n' + err.message);
  }
}

async function releaseSubtask(instanceId, subtaskTemplateId) {
  try {
    await callApi('release_subtask', { instance_id: instanceId, subtask_template_id: subtaskTemplateId });
    await refreshAfterChange();
  } catch (err) {
    alert('放棄失敗，請稍後再試。\n' + err.message);
  }
}

async function completeSubtask(instanceId, subtaskTemplateId, completed) {
  try {
    await callApi('complete_subtask', { instance_id: instanceId, subtask_template_id: subtaskTemplateId, completed });
    await refreshAfterChange();
  } catch (err) {
    alert('更新失敗，請稍後再試。\n' + err.message);
    await refreshAfterChange(); // revert the checkbox visually
  }
}

async function completeTask(assignmentId) {
  if (!confirm('確定要標記這項任務為已完成嗎？')) return;
  try {
    await callApi('complete_task', { assignment_id: assignmentId });
    await refreshAfterChange();
  } catch (err) {
    alert('標記失敗。\n' + err.message);
  }
}

function openClaimModal(instanceId, title) {
  pendingClaimInstanceId = instanceId;
  document.getElementById('claim-modal-task-title').textContent = title;
  document.getElementById('claim-modal-overlay').classList.add('show');
}

document.getElementById('claim-modal-cancel').addEventListener('click', () => {
  document.getElementById('claim-modal-overlay').classList.remove('show');
});

document.getElementById('claim-modal-confirm').addEventListener('click', async () => {
  const name = document.getElementById('claim-name').value.trim();
  const phone = document.getElementById('claim-phone').value.trim();
  if (!name) { alert('請輸入姓名。'); return; }

  const confirmBtn = document.getElementById('claim-modal-confirm');
  confirmBtn.disabled = true;
  confirmBtn.textContent = '送出中…';

  try {
    await callApi('claim_task', { instance_id: pendingClaimInstanceId, display_name: name, phone: phone || null });
    document.getElementById('claim-modal-overlay').classList.remove('show');
    calendarLoadedKey = null; // force a refresh next time calendar is shown
    await loadTasks();
  } catch (err) {
    alert('認領失敗，請稍後再試。\n' + err.message);
  } finally {
    confirmBtn.disabled = false;
    confirmBtn.textContent = '確認認領 Claim';
  }
});

async function releaseTask(assignmentId) {
  if (!confirm('確定要取消認領這項任務嗎？')) return;
  try {
    await callApi('release_task', { assignment_id: assignmentId });
    calendarLoadedKey = null;
    await loadTasks();
  } catch (err) {
    alert('取消失敗，請稍後再試。\n' + err.message);
  }
}

/* ---------- Calendar view ---------- */

function monthKey(d) { return d.getFullYear() + '-' + (d.getMonth() + 1); }
function daysInMonth(d) { return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); }
function toDateStr(y, m, day) {
  return y + '-' + String(m + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
}

async function loadCalendarMonth() {
  const key = monthKey(calendarCursor);
  if (calendarLoadedKey !== key) {
    const y = calendarCursor.getFullYear(), m = calendarCursor.getMonth();
    const from = toDateStr(y, m, 1);
    const { tasks } = await callApi('list_tasks', { from_date: from, days: daysInMonth(calendarCursor) - 1 });
    calendarTasks = tasks || [];
    calendarLoadedKey = key;
  }
  renderCalendarGrid();
  renderCalendarDayList();
}

document.getElementById('cal-prev-btn').addEventListener('click', () => {
  calendarCursor = new Date(calendarCursor.getFullYear(), calendarCursor.getMonth() - 1, 1);
  selectedCalendarDate = null;
  loadCalendarMonth();
});
document.getElementById('cal-next-btn').addEventListener('click', () => {
  calendarCursor = new Date(calendarCursor.getFullYear(), calendarCursor.getMonth() + 1, 1);
  selectedCalendarDate = null;
  loadCalendarMonth();
});

function renderCalendarGrid() {
  const y = calendarCursor.getFullYear(), m = calendarCursor.getMonth();
  document.getElementById('cal-month-label').textContent = calendarCursor.toLocaleDateString('zh-TW', { year: 'numeric', month: 'long' });

  const firstDow = new Date(y, m, 1).getDay();
  const totalDays = daysInMonth(calendarCursor);
  const todayStr = new Date().toISOString().slice(0, 10);

  const byDate = {};
  calendarTasks.forEach(t => {
    if (!byDate[t.occurrence_date]) byDate[t.occurrence_date] = [];
    byDate[t.occurrence_date].push(t);
  });

  const dowLabels = ['日','一','二','三','四','五','六'].map(d => `<div class="cal-dow">${d}</div>`).join('');
  const blanks = Array.from({ length: firstDow }, () => `<div class="cal-day empty"></div>`).join('');
  const cells = Array.from({ length: totalDays }, (_, i) => {
    const day = i + 1;
    const dateStr = toDateStr(y, m, day);
    const dayTasks = byDate[dateStr] || [];
    const hasMine = dayTasks.some(t => !!t.my_assignment_id);
    const classes = ['cal-day'];
    if (dateStr === todayStr) classes.push('today');
    if (dateStr === selectedCalendarDate) classes.push('selected');
    if (hasMine) classes.push('mine-dot');
    return `<div class="${classes.join(' ')}" data-date="${dateStr}">${day}${dayTasks.length ? '<span class="cal-dot"></span>' : ''}</div>`;
  }).join('');

  document.getElementById('cal-grid').innerHTML = dowLabels + blanks + cells;

  document.querySelectorAll('#cal-grid .cal-day:not(.empty)').forEach(cell => {
    cell.addEventListener('click', () => {
      selectedCalendarDate = cell.dataset.date === selectedCalendarDate ? null : cell.dataset.date;
      renderCalendarGrid();
      renderCalendarDayList();
    });
  });
}

function renderCalendarDayList() {
  const listEl = document.getElementById('task-list');
  if (!selectedCalendarDate) {
    listEl.innerHTML = `<div class="empty-note">點選上方日期以查看該天的任務。</div>`;
    return;
  }
  const dayTasks = calendarTasks.filter(t => t.occurrence_date === selectedCalendarDate);
  if (dayTasks.length === 0) {
    listEl.innerHTML = `<div class="cal-selected-heading">${formatDateHeading(selectedCalendarDate)}</div><div class="empty-note">這天沒有任務。</div>`;
    return;
  }
  listEl.innerHTML = `<div class="cal-selected-heading">${formatDateHeading(selectedCalendarDate)}</div>${dayTasks.map(taskCardHTML).join('')}`;
  bindTaskListEvents(listEl);
}

initLiff();
